<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity DashBoard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <!-- <nav></nav> -->
      <section class="allElems">
        <div class="todo elems" id="0">
          <img
            src="https://images.unsplash.com/photo-1651223969333-7a02ad74c4f0?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
            srcset=""
          />
          <h2>To DO List</h2>
        </div>
        <div class="daily elems" id="1">
          <img
            src="https://plus.unsplash.com/premium_photo-1677109899391-f661ac45d798?q=80&w=720&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
            srcset=""
          />
          <h2>Daily Planner</h2>
        </div>
        <div class="moti elems" id="2">
          <img
            src="https://plus.unsplash.com/premium_photo-1685885584657-f1a5d2af5d99?q=80&w=761&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
            srcset=""
          />
          <h2>Motivation</h2>
        </div>
        <div class="pomo elems" id="3">
          <img
            src="https://plus.unsplash.com/premium_photo-1680265342674-1dbeafc588ce?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
            srcset=""
          />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="goals elems" id="4">
          <img
            src="https://plus.unsplash.com/premium_vector-1761319695182-9efc4c390900?q=80&w=695&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D "
            alt=""
            srcset=""
          />
          <h2>Daily Goals</h2>
        </div>
      </section>
      <!-- ------------------------ -->
      <section class="fullElem todo-list-fullpage">
        <button class="back" id="0">Close</button>
        <h2>Your personalised To Do List</h2>
        <div class="todo-container">
          <div class="addTask">
            <form >
              <input id="task-input" type="text" placeholder="Enter Task" />
              <textarea placeholder="Enter Details" name="" id=""></textarea>
              <div class="mark-imp">
                            <input type="checkbox" name="" id="check">
                            <label for="check">Mark as Important!</label>
                        </div>

              <button>Add Task</button>
            </form>
          </div>
          <div class="allTask"></div>
        </div>
      </section>
      <section class="fullElem daily-planner-fullpage">
        <button class="back" id="1">Close</button>
        <h1>Daily Planner</h1>
      </section>
      <section class="fullElem motiviatinal-fullpage">
        <button class="back" id="2">Close</button>
        <h1>Motivational Quote</h1>
      </section>
      <section class="fullElem pomodoro-fullpage">
        <button class="back" id="3">Close</button>
        <h1>Pomodoro Timer</h1>
      </section>
      <section class="fullElem daily-goals-fullpage">
        <button class="back" id="4">Close</button>
        <h1>Daily Goals</h1>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
